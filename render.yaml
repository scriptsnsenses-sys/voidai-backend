services:
  - type: web
    name: voidai-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: voidai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: voidai-cache
          property: connectionString
      - key: MASTER_ADMIN_KEY
        generateValue: true

  - type: keyvalue
    name: voidai-cache
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction

databases:
  - name: voidai-db
    databaseName: voidai
    user: voidai
    plan: free
    region: oregon
    postgresMajorVersion: "16"
